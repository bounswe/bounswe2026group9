name: Backend CI — Hermetic DB

# Opt-in lane. The default Backend CI keeps using the shared TEST_SUPABASE_*
# project; this workflow validates that the same suite runs against a fully
# hermetic Postgres + PostgREST stack booted via testcontainers. Promote
# this lane to the default once it's been green for a week against the same
# set of PRs.
on:
  workflow_dispatch:
  schedule:
    # Nightly @ 03:00 UTC so a flake on the hermetic side doesn't block PRs.
    - cron: "0 3 * * *"

concurrency:
  group: backend-ci-hermetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same shard layout the legacy lane uses, so a side-by-side
          # comparison stays apples-to-apples.
          - shard: smoke
            pytest_args: tests/db
          - shard: auth-core
            pytest_args: >-
              tests/test_auth.py
              tests/test_categories.py
              tests/test_health.py
              tests/test_users.py
          - shard: events
            pytest_args: tests/test_events.py
          - shard: discovery
            pytest_args: tests/test_discovery.py
          - shard: comments-invites
            pytest_args: >-
              tests/test_comments.py
              tests/test_invites.py
          - shard: media-notifications
            pytest_args: >-
              tests/test_images.py
              tests/test_bookmarks.py
              tests/test_attendances.py
              tests/test_checkin.py
              tests/test_notifications.py
              tests/test_notification_emitter.py
              tests/test_recommendation_emitter.py
          - shard: e2e
            pytest_args: tests/e2e
    defaults:
      run:
        working-directory: backend

    env:
      # Hermetic lane signs JWTs for the test stack only — secrets never
      # leak into a real environment. The supabase client also expects
      # these to be set even when it's pointed at the local stack.
      JWT_SECRET: hermetic-jwt-secret-not-for-prod
      JWT_REFRESH_SECRET: hermetic-jwt-refresh-secret-not-for-prod
      ENVIRONMENT: development
      # SUPABASE_URL/KEY get overwritten by the in-process bootstrap once
      # the stack is up, but the supabase Client constructor validates
      # these aren't empty at import time, so seed plausible placeholders.
      SUPABASE_URL: http://localhost:0
      SUPABASE_KEY: bootstrap-only-overwritten-by-conftest
      PG_CONTAINER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull container images ahead of time
        # Docker pulls dominate cold-cache wall time; do it explicitly so
        # the test phase reflects code-time, not image-fetch time.
        run: |
          docker pull postgres:16-alpine
          docker pull postgrest/postgrest:v12.2.0

      - name: Run hermetic shard
        # `-n auto` is intentionally NOT set here. With autouse session
        # bootstrap each xdist worker would boot its own stack, so the
        # gain is wiped out by 4× container startup. Single-process is
        # fine — TRUNCATE-per-test isolation removes the cross-test
        # serialisation pressure the Supabase lane has.
        run: pytest -v -ra --durations=20 --no-cov ${{ matrix.pytest_args }}
