name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tests_support.py'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      ENVIRONMENT: development
      TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

  unit-fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      ENVIRONMENT: development
      TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast unit tests
        run: pytest tests/test_*_unit.py -v -ra

  integration-sharded:
    needs:
      - lint
      - unit-fast
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: auth-core
            pytest_args: >-
              tests/test_auth.py
              tests/test_auth_integration.py
              tests/test_categories.py
              tests/test_health.py
              tests/test_users.py
          - shard: events
            pytest_args: >-
              tests/test_events.py
          - shard: discovery
            pytest_args: >-
              tests/test_discovery.py
          - shard: comments-invites
            pytest_args: >-
              tests/test_comments.py
              tests/test_invites.py
          - shard: media-notifications
            pytest_args: >-
              tests/test_images.py
              tests/test_bookmarks.py
              tests/test_attendances.py
              tests/test_notifications.py
              tests/test_notification_emitter.py
    defaults:
      run:
        working-directory: backend

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      ENVIRONMENT: development
      TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration shard
        run: pytest -v -ra --durations=15 --durations-min=1.0 ${{ matrix.pytest_args }}
