name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tests_support.py'
      - '.github/workflows/backend-ci.yml'

# Same group per PR + cancel-in-progress so a fresh push on the branch
# kills the in-flight run before it consumes a Supabase pooler slot the
# next run would otherwise contend for.
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # CI runs against a dedicated test Supabase project so prod data is
      # never polluted by integration tests. The deploy workflow keeps using
      # the unprefixed prod secrets — only this workflow points at TEST_*.
      SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.TEST_SUPABASE_KEY }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.TEST_JWT_REFRESH_SECRET }}
      ENVIRONMENT: development
      TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

  static-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Type check (mypy strict + shrinking baseline)
        # The baseline file locks today's 408 strict-mode errors. CI fails
        # if any new error appears (`new > 0`), and a regular `sync` step
        # in a follow-up PR can ratchet the count down.
        run: mypy app | mypy-baseline filter

      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r app/

  unit-fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # CI runs against a dedicated test Supabase project so prod data is
      # never polluted by integration tests. The deploy workflow keeps using
      # the unprefixed prod secrets — only this workflow points at TEST_*.
      SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.TEST_SUPABASE_KEY }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.TEST_JWT_REFRESH_SECRET }}
      ENVIRONMENT: development
      TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast unit tests
        run: pytest tests/test_*_unit.py -v -ra

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-fast
          path: backend/coverage.xml
          retention-days: 14

  integration-sharded:
    needs:
      - lint
      - unit-fast
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: auth-core
            pytest_args: >-
              tests/test_auth.py
              tests/test_categories.py
              tests/test_health.py
              tests/test_users.py
          - shard: events
            pytest_args: >-
              tests/test_events.py
          - shard: discovery
            pytest_args: >-
              tests/test_discovery.py
          - shard: comments-invites
            pytest_args: >-
              tests/test_comments.py
              tests/test_invites.py
          - shard: media-notifications
            pytest_args: >-
              tests/test_images.py
              tests/test_bookmarks.py
              tests/test_attendances.py
              tests/test_checkin.py
              tests/test_notifications.py
              tests/test_notification_emitter.py
              tests/test_recommendation_emitter.py
    defaults:
      run:
        working-directory: backend

    env:
      # CI runs against a dedicated test Supabase project so prod data is
      # never polluted by integration tests. The deploy workflow keeps using
      # the unprefixed prod secrets — only this workflow points at TEST_*.
      SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.TEST_SUPABASE_KEY }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.TEST_JWT_REFRESH_SECRET }}
      ENVIRONMENT: development
      TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration shard
        # `-n auto` parallelises tests across CPUs inside the shard. Tests are
        # already process-safe — every fixture mints a unique identity via
        # `build_test_identity` so cross-worker collisions don't happen.
        run: pytest -v -ra -n auto --durations=15 --durations-min=1.0 ${{ matrix.pytest_args }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: backend/coverage.xml
          retention-days: 14

  e2e-hermetic:
    # Cross-feature E2E scenarios from issue #153 run on every PR against a
    # hermetic Postgres + PostgREST stack — required check, not nightly-only.
    # The full hermetic-vs-Supabase parity sweep stays in
    # `backend-ci-hermetic.yml`; this job is just the three E2E flows.
    needs:
      - lint
      - unit-fast
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Hermetic stack mints its own JWTs; the supabase Client constructor
      # validates URL/KEY at import time so we seed plausible placeholders
      # — the in-process bootstrap in tests/conftest.py overwrites both.
      JWT_SECRET: hermetic-pr-jwt-secret
      JWT_REFRESH_SECRET: hermetic-pr-jwt-refresh-secret
      ENVIRONMENT: development
      SUPABASE_URL: http://localhost:0
      SUPABASE_KEY: bootstrap-only-overwritten-by-conftest
      PG_CONTAINER: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull container images ahead of time
        # Container pulls dominate cold-cache wall time; do it explicitly
        # so the test phase reflects code-time, not image-fetch time.
        run: |
          docker pull postgres:16-alpine
          docker pull postgrest/postgrest:v12.2.0

      - name: Run E2E scenarios
        # The three cross-feature scenarios listed in issue #153:
        # private-access full flow, capacity → Full in discovery, full
        # itinerary lifecycle. Single-process — TRUNCATE-per-test gives
        # us the isolation parallel xdist would otherwise provide.
        run: pytest tests/e2e -v -ra --durations=10 --no-cov
