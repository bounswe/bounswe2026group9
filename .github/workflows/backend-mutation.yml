name: Backend Mutation Testing

# Mutation testing is expensive — opt-in only. The nightly cadence
# strikes a balance between feedback latency and CI minute spend, and
# the manual trigger lets us re-run after a kill-set update.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"  # 30 min after the hermetic lane

concurrency:
  group: backend-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Mutation testing imports the app, which needs the constructor
      # arguments to be plausible. Real values are not required because
      # the kill set is the unit + property + snapshot suite — none of
      # those touch a real Supabase.
      SUPABASE_URL: http://localhost:0
      SUPABASE_KEY: bootstrap-only-mutation
      JWT_SECRET: mutation-jwt-secret
      JWT_REFRESH_SECRET: mutation-jwt-refresh-secret
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mutmut
        # `mutmut run` writes results to .mutmut-cache; the report step
        # reads them back. `--no-progress` keeps the log readable when
        # GitHub Actions truncates very long lines.
        run: mutmut run --no-progress
        continue-on-error: true

      - name: Mutation report
        run: mutmut results
        continue-on-error: true

      - name: Upload mutmut cache as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-cache
          path: backend/.mutmut-cache
          retention-days: 14
