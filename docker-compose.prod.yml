services:
  backend:
    image: ${BACKEND_IMAGE:-your-dockerhub-username/sem-backend:latest}
    container_name: sem-backend
    env_file:
      - ./backend/.env.production
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
