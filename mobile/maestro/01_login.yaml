- tapOn: "Email"
- inputText: "emir27_bora@hotmail.com"
- tapOn: "Password"
- inputText: "Deneme123."
- tapOn:
    text: "Sign In"
    index: 1
- waitForAnimationToEnd
- assertVisible: "SOCIAL EVENT MAPPER"
- assertVisible: "Discover"
