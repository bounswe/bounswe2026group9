services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sem-backend
    ports:
      - "8888:8000"
    env_file:
      - ./backend/.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    restart: unless-stopped
