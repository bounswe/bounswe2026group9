services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sem-backend
    ports:
      - "8888:8000"
    env_file:
      - ./backend/.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8888
    container_name: sem-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
